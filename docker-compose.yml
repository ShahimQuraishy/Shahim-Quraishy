services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: senior_assistant
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/sql/001_schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro

  api:
    build:
      context: ./backend
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: ******postgres:postgres@db:5432/senior_assistant
      API_UPDATE_KEY: change-me
      RETENTION_DAYS: 365
    ports:
      - "3000:3000"
    depends_on:
      - db

volumes:
  pgdata:
